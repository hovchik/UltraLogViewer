name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end UI test
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/out/

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -warnaserror
      - name: Engine and headless UI tests
        run: dotnet test --no-build
        env:
          ULV_SCREENSHOTS: ${{ github.workspace }}/dotnet/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-screenshots
          path: dotnet/screenshots/
